name: qr_toolkit
description: "QR code generator and scanner with history."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  sqflite: ^2.4.4+2
  path: ^1.9.1
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  flutter_svg: ^2.3.0
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/